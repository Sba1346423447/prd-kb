<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRD-KB 企业技术支持智研知识库</title>
<!-- 全局样式 -->
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- 登录遮罩层 -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <div class="login-logo">智</div>
    <div class="login-title">PRD-KB 企业技术支持智研知识库</div>
    <form id="loginForm" autocomplete="off">
      <input class="login-input" id="loginUsername" placeholder="用户名" autocomplete="username">
      <input class="login-input" id="loginPassword" type="password" placeholder="密码" autocomplete="current-password">
      <button class="login-submit" type="submit">登 录</button>
    </form>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-ai-avatar">AI</div>
      <div class="sidebar-ai-info">
        <span class="sidebar-ai-name">智研</span>
        <span class="sidebar-ai-status">在线</span>
      </div>
    </div>
    <div class="sidebar-menu">
      <div class="sidebar-menu-item" id="newChatBtn">
        <span class="menu-icon">💬</span>
        <span>新对话</span>
      </div>
      <div class="sidebar-menu-item">
        <span class="menu-icon">☁️</span>
        <span>云盘</span>
      </div>
      <div class="sidebar-menu-item">
        <span class="menu-icon">⋯</span>
        <span>更多</span>
        <span class="menu-plus">+</span>
      </div>
    </div>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-bottom">
      <div class="sidebar-user-avatar" id="userAvatar">U</div>
      <span class="sidebar-user-name" id="userName">未登录</span>
      <span class="sidebar-user-logout" id="logoutBtn" title="退出登录">退出</span>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-logo">智</div>
        <span class="topbar-title">PRD-KB 企业技术支持智研知识库</span>
      </div>
      <div class="topbar-center">
        <div class="topbar-chat-label">对话框</div>
        <div class="topbar-disclaimer">AI 生成可能有误 注意核实</div>
      </div>
      <div class="topbar-session">
        <span class="topbar-session-label">会话</span>
        <input class="topbar-session-input" id="sessionId" value="" placeholder="点击新对话创建" readonly>
      </div>
    </div>

    <div class="chat-container" id="chatContainer">
      <div class="welcome" id="welcome">
        <div class="welcome-greeting">欢迎使用 PRD-KB 企业技术支持智研知识库，有什么我能够帮到你的吗？</div>
        <div class="suggestions" id="suggestions"></div>
      </div>
    </div>

    <div class="input-area">
      <button class="plus-btn" id="imagePickerBtn" type="button" title="添加图片">+</button>
      <input type="file" id="imageInput" accept="image/*" multiple hidden>
      <div class="image-preview-area" id="imagePreviewArea"></div>
      <div class="input-wrapper">
        <textarea id="userInput" rows="1" placeholder="输入你的问题，按 Enter 发送，Shift+Enter 换行..."></textarea>
      </div>
      <div class="quick-dropdown" id="modeDropdown">
        <button class="quick-btn" id="modeBtn" type="button" title="切换检索模式">
          <span id="modeLabel">Agent</span>
          <span class="quick-btn-arrow">&#9662;</span>
        </button>
        <div class="quick-menu">
          <div class="quick-item" data-mode="auto" title="按问题特征自动选择最优模式">Auto</div>
          <div class="quick-item" data-mode="pure" title="检索直出，响应更快">Pure</div>
          <div class="quick-item active" data-mode="agent" title="更高质量的回复">Agent</div>
        </div>
      </div>
      <button class="send-btn" id="sendBtn" title="发送">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
      <button class="stop-btn" id="stopBtn" title="停止生成" style="display:none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <rect x="4" y="4" width="16" height="16" rx="2"></rect>
        </svg>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/js/vendor/marked.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
