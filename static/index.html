<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRD-KB 企业技术支持智研知识库</title>
<!-- 全局样式 -->
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-ai-avatar">AI</div>
      <div class="sidebar-ai-info">
        <span class="sidebar-ai-name">智研</span>
        <span class="sidebar-ai-status">在线</span>
      </div>
    </div>
    <div class="sidebar-menu">
      <div class="sidebar-menu-item" id="newChatBtn">
        <span class="menu-icon">💬</span>
        <span>新对话</span>
      </div>
      <div class="sidebar-menu-item">
        <span class="menu-icon">☁️</span>
        <span>云盘</span>
      </div>
      <div class="sidebar-menu-item">
        <span class="menu-icon">⋯</span>
        <span>更多</span>
        <span class="menu-plus">+</span>
      </div>
    </div>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-bottom" title="点击进入个人主页">
      <div class="sidebar-user-avatar">U</div>
      <span class="sidebar-user-name">用户</span>
      <span class="sidebar-user-arrow">→</span>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-logo">智</div>
        <span class="topbar-title">PRD-KB 企业技术支持智研知识库</span>
      </div>
      <div class="topbar-center">
        <div class="topbar-chat-label">对话框</div>
        <div class="topbar-disclaimer">AI 生成可能有误 注意核实</div>
      </div>
      <div class="topbar-session">
        <span class="topbar-session-label">会话</span>
        <input class="topbar-session-input" id="sessionId" value="user_001" placeholder="会话ID">
      </div>
    </div>

    <div class="chat-container" id="chatContainer">
      <div class="welcome" id="welcome">
        <div class="welcome-greeting">欢迎使用 PRD-KB 企业技术支持智研知识库，有什么我能够帮到你的吗？</div>
        <div class="suggestions" id="suggestions"></div>
      </div>
    </div>

    <div class="input-area">
      <button class="plus-btn" title="添加">+</button>
      <div class="input-wrapper">
        <textarea id="userInput" rows="1" placeholder="输入你的问题，按 Enter 发送，Shift+Enter 换行..."></textarea>
      </div>
      <button class="send-btn" id="sendBtn" title="发送">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
      <button class="stop-btn" id="stopBtn" title="停止生成" style="display:none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <rect x="4" y="4" width="16" height="16" rx="2"></rect>
        </svg>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
